<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React Integration Example • Interactive SVG Map</title>
  <link rel="stylesheet" href="../dist/interactive-svg-map.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .app-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .map-box { height: 580px; margin-top: 16px; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Map Bundle -->
  <script src="../dist/usa-all-data.js"></script>
  <script src="../dist/canada-all-data.js"></script>
  <script src="../dist/interactive-svg-map.js"></script>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function InteractiveMapComponent({ country, onSelectEntity }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (mapContainerRef.current && !mapInstanceRef.current) {
          mapInstanceRef.current = new window.GeoMap(mapContainerRef.current, {
            country: country,
            theme: 'dark',
            activeLayer: 'counties',
            onStateClick: (state) => onSelectEntity?.('state', state),
            onCityClick: (city) => onSelectEntity?.('city', city),
            onZipClick: (zip) => onSelectEntity?.('zip', zip)
          });
        }
        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.destroy();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.setCountry(country);
        }
      }, [country]);

      return <div ref={mapContainerRef} className="map-box" />;
    }

    function App() {
      const [country, setCountry] = useState('usa');
      const [selectedEntity, setSelectedEntity] = useState(null);

      return (
        <div className="app-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <h2>React + Interactive SVG Map Component</h2>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button 
                onClick={() => { setCountry('usa'); setSelectedEntity(null); }}
                style={{ padding: '6px 12px', background: country === 'usa' ? '#38bdf8' : '#334155', color: country === 'usa' ? '#0f172a' : '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 700 }}
              >
                🇺🇸 USA
              </button>
              <button 
                onClick={() => { setCountry('canada'); setSelectedEntity(null); }}
                style={{ padding: '6px 12px', background: country === 'canada' ? '#38bdf8' : '#334155', color: country === 'canada' ? '#0f172a' : '#fff', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: 700 }}
              >
                🇨🇦 Canada
              </button>
            </div>
          </div>
          <p style={{ color: '#94a3b8', fontSize: '13px', marginTop: '6px' }}>
            Selected: <strong>{selectedEntity ? `${selectedEntity.type.toUpperCase()}: ${selectedEntity.data.name || selectedEntity.data.zip}` : 'None (National View)'}</strong>
          </p>
          <InteractiveMapComponent 
            country={country} 
            onSelectEntity={(type, data) => setSelectedEntity({ type, data })} 
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
